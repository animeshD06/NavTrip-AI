</div>

<span class="material-symbols-outlined text-[120px]" style="font-variation-settings: 'FILL' 0;">amp</span>
</div>
</div>
</section>
<!-- Right Side: Login Form (Clean Journal Page) -->
<section class="flex-1 flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop py-stack-lg bg-surface-bright paper-texture">
<div class="w-full max-w-md space-y-stack-lg">
<!-- Branding Anchor -->
<div class="mb-stack-lg text-center md:text-left">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">NavTrip-AI</h1>
</div>
<div class="space-y-stack-sm">
<h2 class="font-display-lg text-display-lg text-on-surface leading-tight">Welcome Back</h2>
<p class="font-body-md text-on-surface-variant italic">Your memories are waiting for you.</p>
</div>
<!-- Form Section -->
<form class="space-y-gutter mt-stack-lg" onsubmit="event.preventDefault();">
<!-- Email Field (Underlined Notebook style) -->
<div class="space-y-stack-sm group">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">Email Address</label>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 transition-all placeholder:text-outline-variant font-body-md" id="email" name="email" placeholder="traveler@voyage.com" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-stack-sm group">
<div class="flex justify-between items-end">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-caption text-caption text-primary hover:underline" href="#">Forgot?</a>
</div>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 transition-all placeholder:text-outline-variant font-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<!-- Actions -->
<div class="pt-stack-md flex flex-col gap-unit">
<button class="w-full py-4 bg-primary text-on-primary font-label-md rounded-full hover:bg-primary-container transition-all active:scale-95 shadow-md flex items-center justify-center gap-2 group" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</form>

<div class="flex-grow border-t border-dotted border-outline-variant"></div>

<!-- Interactive script for subtle hover effects -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.classList.add('transition-transform');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple parallax or movement for the left side image on mouse move
        const photo = document.querySelector('.taped-photo');
        if (photo) {
            window.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 100;
                const moveY = (e.clientY - window.innerHeight / 2) / 100;
                photo.style.transform = `rotate(-1deg) translate(${moveX}px, ${moveY}px)`;
            });
        }
    </script>
</body></html>
