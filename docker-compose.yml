services:
  db:
    image: postgis/postgis:16-3.4
    container_name: navtrip-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-navtrip_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-navtrip_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: navtrip-ai-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/navtrip_ai}
      JWT_SECRET: ${JWT_SECRET:-change-me-for-local-docker}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8002,http://127.0.0.1:8002}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:4000/api}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
        FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
        FIREBASE_WEB_CLIENT_ID: ${FIREBASE_WEB_CLIENT_ID:-}
        FIREBASE_IOS_CLIENT_ID: ${FIREBASE_IOS_CLIENT_ID:-}
        FIREBASE_ANDROID_CLIENT_ID: ${FIREBASE_ANDROID_CLIENT_ID:-}
        FIREBASE_IOS_BUNDLE_ID: ${FIREBASE_IOS_BUNDLE_ID:-}
        FIREBASE_APP_GROUP_ID: ${FIREBASE_APP_GROUP_ID:-}
        FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
        FIREBASE_TRACKING_ID: ${FIREBASE_TRACKING_ID:-}
        FIREBASE_DEEP_LINK_URL_SCHEME: ${FIREBASE_DEEP_LINK_URL_SCHEME:-}
    container_name: navtrip-ai-frontend
    restart: unless-stopped
    ports:
      - "8002:80"
    depends_on:
      - backend

  migrate:
    build:
      context: ./backend
    profiles:
      - tools
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/navtrip_ai}
      JWT_SECRET: ${JWT_SECRET:-change-me-for-local-docker}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:schema && npm run db:seed && npm run db:postgis"
    restart: "no"

volumes:
  postgres-data:
